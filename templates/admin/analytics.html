{% extends "layouts/dashboard_base.html" %}{% block content %}<div class="container-fluid py-4"><h3>System Analytics</h3><div class="row g-3">{% for k,v in stats.items() %}<div class="col-md-3"><div class="card border-0 shadow-sm p-3"><small class="text-muted">{{k|title}}</small><div class="fs-3 fw-bold">{{v}}</div></div></div>{% endfor %}</div><div class="card border-0 shadow-sm p-4 mt-4"><h5>Feedback</h5><div class="fs-2">{{feedback_summary.average_rating or '—'}} / 5</div><p>{{feedback_summary.total_feedback}} responses</p></div></div>{% endblock %}
