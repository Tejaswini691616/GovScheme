<!-- PATH: GovScheme/templates/admin/users.html -->
{% extends "layouts/dashboard_base.html" %}{% block content %}<div class="container-fluid py-4"><h3>Users</h3><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Language</th><th>Admin</th><th>Created</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.email}}</td><td>{{u.phone or '—'}}</td><td>{{u.preferred_language}}</td><td>{{'Yes' if u.is_admin else 'No'}}</td><td>{{u.created_at}}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
